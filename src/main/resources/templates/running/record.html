<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/images/97_logo_inverted.png">
    <title>97Runners</title>
    <script src='https://unpkg.com/tesseract.js@4.1.1/dist/tesseract.min.js'></script>
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="bg">
<nav class="navbar">
    <div class="nav-container">
        <a href="/running/home" class="nav-link">러닝 마일리지</a>
        <a href="/running/record" class="nav-link">러닝 기록 추가하기</a>
        <a href="/running/regular" class="nav-link">정규런 보러가기</a>
    </div>
</nav>
<div class="container">
    <h2>Running Record</h2>
    
    <!-- Weekly Top Runners Section -->
    <div class="weekly-stats">
        <div class="stats-section">
            <h3>이번 주 거리 순위</h3>
            <div id="weeklyDistanceRanking" class="ranking-list">
                <div class="loading">데이터 로딩 중...</div>
            </div>
        </div>
        
        <div class="stats-section">
            <h3>이번 주 횟수 순위</h3>
            <div id="weeklyFrequencyRanking" class="ranking-list">
                <div class="loading">데이터 로딩 중...</div>
            </div>
        </div>
    </div>

    <div class="ocr-section">
        <h3>러닝 기록 입력</h3>
        <div class="input-options">
            <div class="upload-container">
                <input type="file" id="imageFile" accept="image/*">
                <button onclick="processImage()" class="button">이미지에서 텍스트 추출</button>
                <button onclick="showManualInput()" class="button button-secondary">수동 입력</button>
            </div>
        </div>
        <div id="statusMessage" class="status"></div>
        <div id="extractedText" class="result"></div>

        <div id="parsedData" class="parsed-data" style="display: none;">
            <h3>파싱된 러닝 기록</h3>
            <div class="data-item">
                <span class="data-label">이름:</span>
                <input type="text" id="runnerName" class="editable-field" placeholder="러너 이름 (필수)" required>
            </div>
            <div class="data-item">
                <span class="data-label">장소:</span>
                <input type="text" id="location" class="editable-field" placeholder="달린 장소">
            </div>
            <div class="data-item">
                <span class="data-label">날짜 및 시간:</span>
                <input type="datetime-local" id="datetime" class="editable-field">
            </div>
            <div class="data-item">
                <span class="data-label">거리:</span>
                <input type="number" id="distance" class="editable-field" step="0.01" placeholder="0.00" min="0" required> km
            </div>
            <div class="data-item">
                <span class="data-label">페이스:</span>
                <input type="text" id="pace" class="editable-field" placeholder="예: 5:30 /km">
            </div>
            <div style="margin-top: 20px;">
                <button onclick="submitRecord()" class="button">기록 저장</button>
            </div>
        </div>
    </div>
    <a href="/running/home" class="nav-link">이전 화면</a>
</div>

<script th:inline="javascript">
    let currentData = {};

    // Load weekly statistics on page load
    document.addEventListener('DOMContentLoaded', function() {
        loadWeeklyStats();
    });

    async function loadWeeklyStats() {
        try {
            // Load distance ranking
            const distanceResponse = await fetch('/running/weekly-top-distance');
            const distanceData = await distanceResponse.json();
            displayDistanceRanking(distanceData);

            // Load frequency ranking
            const frequencyResponse = await fetch('/running/weekly-top-frequency');
            const frequencyData = await frequencyResponse.json();
            displayFrequencyRanking(frequencyData);
        } catch (error) {
            console.error('주간 통계 로딩 오류:', error);
            document.getElementById('weeklyDistanceRanking').innerHTML = '<div class="error">데이터 로딩 실패</div>';
            document.getElementById('weeklyFrequencyRanking').innerHTML = '<div class="error">데이터 로딩 실패</div>';
        }
    }

    function displayDistanceRanking(data) {
        const container = document.getElementById('weeklyDistanceRanking');
        if (data.length === 0) {
            container.innerHTML = '<div class="no-data">이번 주 데이터가 없습니다.</div>';
            return;
        }

        const html = data.map((runner, index) => `
            <div class="ranking-item ${index < 3 ? 'top-three' : ''}">
                <span class="rank">${index + 1}</span>
                <span class="name">${runner.name}</span>
                <span class="distance">${runner.totalDistance.toFixed(2)}km</span>
            </div>
        `).join('');
        
        container.innerHTML = html;
    }

    function displayFrequencyRanking(data) {
        const container = document.getElementById('weeklyFrequencyRanking');
        if (data.length === 0) {
            container.innerHTML = '<div class="no-data">이번 주 데이터가 없습니다.</div>';
            return;
        }

        const html = data.map((runner, index) => `
            <div class="ranking-item ${index < 3 ? 'top-three' : ''}">
                <span class="rank">${index + 1}</span>
                <span class="name">${runner.name}</span>
                <span class="frequency">${runner.runCount}회</span>
            </div>
        `).join('');
        
        container.innerHTML = html;
    }

    function showManualInput() {
        // Show the form directly without image processing
        const parsedDataDiv = document.getElementById('parsedData');
        const statusDiv = document.getElementById('statusMessage');
        const resultDiv = document.getElementById('extractedText');
        
        // Clear any previous status messages
        statusDiv.innerHTML = '';
        resultDiv.innerHTML = '';
        
        // Initialize with default data (current time)
        const now = new Date();
        currentData = {
            name: '',
            location: '',
            dateTime: now.toISOString(),
            distance: 0,
            pace: ''
        };
        
        displayParsedData(currentData);
        statusDiv.innerHTML = '<div class="info">수동 입력 모드: 아래 양식을 직접 작성해주세요.</div>';
    }

    async function processImage() {
        const imageFile = document.getElementById('imageFile').files[0];
        const statusDiv = document.getElementById('statusMessage');
        const resultDiv = document.getElementById('extractedText');
        const parsedDataDiv = document.getElementById('parsedData');

        if (!imageFile) {
            // Instead of showing alert, offer manual input option
            showManualInput();
            return;
        }

        try {
            statusDiv.innerHTML = '이미지 처리중...';

            const result = await Tesseract.recognize(
                imageFile,
                'kor+eng',
                {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            statusDiv.innerHTML = `처리중: ${Math.round(m.progress * 100)}%`;
                        }
                    }
                }
            );

            resultDiv.innerHTML = `
                <h4>추출된 텍스트:</h4>
                <pre>${result.data.text}</pre>
            `;

            const response = await sendToServer(result.data.text);
            console.log('Server response:', response);
            currentData = response;
            displayParsedData(response);

        } catch (error) {
            console.error('처리 중 오류:', error);
            statusDiv.innerHTML = '처리 중 오류가 발생했습니다: ' + error.message;
        }
    }

    async function sendToServer(text) {
        try {
            const response = await fetch('/running/save-ocr', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ text: text })
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            return await response.json();
        } catch (error) {
            console.error('서버 전송 오류:', error);
            document.getElementById('statusMessage').innerHTML =
                '서버 전송 중 오류가 발생했습니다: ' + error.message;
            throw error;
        }
    }

    function displayParsedData(data) {
        document.getElementById('parsedData').style.display = 'block';
        document.getElementById('runnerName').value = data.name || '';
        document.getElementById('location').value = data.location || '';
        document.getElementById('datetime').value = data.dateTime ? formatDateTime(data.dateTime) : '';
        document.getElementById('distance').value = data.distance || '';
        document.getElementById('pace').value = data.pace || '';
    }

    function formatDateTime(dateTimeStr) {
        if (!dateTimeStr) return '';
        const date = new Date(dateTimeStr);
        return date.toISOString().slice(0, 16); // "YYYY-MM-DDTHH:mm" 형식
    }

    async function submitRecord() {
        try {
            // Basic validation for required fields
            const name = document.getElementById('runnerName').value.trim();
            const distance = parseFloat(document.getElementById('distance').value);
            
            if (!name) {
                alert('이름을 입력해주세요.');
                return;
            }
            
            if (!distance || distance <= 0) {
                alert('유효한 거리를 입력해주세요.');
                return;
            }
            
            const updatedData = {
                ...currentData,
                name: name,
                location: document.getElementById('location').value,
                dateTime: document.getElementById('datetime').value
                    ? new Date(document.getElementById('datetime').value).toISOString()
                    : null,
                distance: distance,
                pace: document.getElementById('pace').value
            };

            const response = await fetch('/running/save', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(updatedData)
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            alert('러닝 기록이 저장되었습니다.');
        } catch (error) {
            console.error('저장 중 오류:', error);
            alert('저장 중 오류가 발생했습니다: ' + error.message);
        }
    }
</script>
</body>
</html>
